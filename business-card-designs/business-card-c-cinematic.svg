<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .jp { font-family: 'Noto Sans JP','Yu Gothic','Meiryo',sans-serif; }
      .serif { font-family: 'Cormorant Garamond','Times New Roman',serif; }
      .smallcaps { letter-spacing: 3px; text-transform: uppercase; }
      .label { font-size: 17px; fill: #4a5a6a; }
      .micro { font-size: 13px; fill: #8a9aaa; letter-spacing: 1.2px; }
      .body { font-size: 18px; fill: #1a2a3a; }
      .shadow { filter: drop-shadow(0 14px 26px rgba(20,37,61,.16)); }
    </style>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14253d"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f9"/>
